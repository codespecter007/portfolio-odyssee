# Pipeline push → tests → publication.
#   1. Tests : site (lint, format, build, Playwright) et API (types, tests unitaires et de bout en bout).
#   2. Images Docker multi-architecture (amd64, et arm64 pour Oracle Ampere), publiées sur GHCR.
#   3. Test de fumée : la pile démarre réellement et répond.
#   4. Déploiement sur le serveur par SSH, puis vérification en ligne.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRE: ghcr.io/${{ github.repository_owner }}

jobs:
  test-web:
    name: Site · lint, build, Playwright
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-playwright
          path: web/tests/captures
          retention-days: 7

  test-api:
    name: API · types et tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Images Docker (${{ matrix.app }})
    needs: [test-web, test-api]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRE }}/portfolio-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRE }}/portfolio-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  fumee:
    name: Test de fumée de la pile
    needs: images
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Démarrer la base, l’API et le site
        working-directory: infra
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "DOMAINE=localhost"
            echo "ACME_EMAIL=ci@example.com"
            echo "GHCR_OWNER=$GHCR_OWNER"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "POSTGRES_PASSWORD=ci"
            echo "JWT_SECRET=ci"
            echo "REVALIDATE_SECRET=ci"
            echo "ADMIN_EMAIL=ci@example.com"
            echo "ADMIN_PASSWORD_HASH='non-utilise-en-test'"
            echo "GRAFANA_ADMIN_PASSWORD=ci"
            echo "UMAMI_APP_SECRET=ci"
          } > .env
          docker compose up -d --wait db api web
      - name: Vérifier les réponses
        working-directory: infra
        run: |
          docker compose exec -T api node -e "fetch('http://localhost:4000/health').then(r=>r.json()).then(j=>{console.log(j);process.exit(j.statut==='ok'?0:1)})"
          docker compose exec -T web node -e "fetch('http://api:4000/api/projets').then(r=>r.json()).then(p=>{console.log(p.length+' projets en base');process.exit(p.length>0?0:1)})"
          docker compose exec -T web node -e "fetch('http://localhost:3000/projets/').then(async r=>{const t=await r.text();console.log('Page projets :',r.status);process.exit(r.ok&&t.includes('Cybernova')?0:1)})"
      - if: failure()
        working-directory: infra
        run: docker compose logs --tail 80

  deploiement:
    name: Déploiement sur le serveur
    needs: fumee
    # S’active dès que la variable DOMAINE est définie dans le dépôt (Settings → Variables).
    if: github.ref == 'refs/heads/main' && vars.DOMAINE != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAINE }}
    steps:
      - uses: actions/checkout@v4
      - name: Copier la configuration sur le serveur
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/docker-compose.yml,infra/caddy,infra/prometheus,infra/grafana,infra/postgres
          target: ~/portfolio
      - name: Mettre à jour les conteneurs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/portfolio/infra
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
            docker compose pull --quiet
            docker compose up -d --remove-orphans --wait
            docker image prune -f
      - name: Vérifier le site en ligne
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.DOMAINE }}/api/projets" > /dev/null; then
              echo "Site en ligne : https://${{ vars.DOMAINE }}"; exit 0
            fi
            sleep 6
          done
          echo "Le site ne répond pas après le déploiement"; exit 1
